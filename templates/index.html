<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-bg-start: #0b2e2e;
            --color-bg-end: #0f766e;
            --color-surface: rgba(255, 255, 255, 0.96);
            --color-text: #12302f;
            --color-text-muted: #5b7776;
            --color-border: #cfe0de;
            --color-primary: #0f766e;
            --color-primary-hover: #0b5f58;
            --color-accent: #f59e0b;
            --color-result-bg: #ecfdf5;
            --color-result-text: #047857;


            --font-sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;


            --bs-body-font-family: var(--font-sans);
            --bs-body-color: var(--color-text);
            --bs-primary: var(--color-primary);
            --bs-primary-rgb: 15, 118, 110;
        }

        body {
            font-family: var(--font-sans);
            color: var(--color-text);
            background: linear-gradient(135deg, var(--color-bg-start), var(--color-bg-end));
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }


        /* Barra de navegación (rama feature-redesign-navbar) */
        .site-navbar {
            padding: 1rem 0;
            background: #f8faff;
            border-bottom: 1px solid #dce5f3;
            box-shadow: 0 4px 18px rgba(15, 35, 70, 0.15);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        .site-navbar .navbar-content {
            gap: 1rem;
        }
        .site-navbar .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 0;
            color: #1e3c72;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: normal;
        }
        .site-navbar .navbar-logo {
            flex-shrink: 0;
            padding: 0.35rem;
            border-radius: 12px;
            background: #e8eef8;
            object-fit: contain;
        }
        .site-navbar .navbar-link {
            padding: 0.65rem 1.25rem;
            border-radius: 999px;
            background: #1e3c72;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
        }
        .site-navbar .navbar-link:hover {
            background: #2a5298;
        }
        .site-navbar a:focus-visible {
            outline: 3px solid #2a5298;
            outline-offset: 4px;
        }
        @media (max-width: 575.98px) {
            .site-navbar .navbar-content {
                flex-direction: column;
            }
            .site-navbar .navbar-brand {
                font-size: 1rem;
            }
            .site-navbar .navbar-link {
                width: 100%;
                text-align: center;
            }
        }


        .converter-card {
            width: 100%;
            max-width: 420px;
            border: 0;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: var(--color-surface);
        }
        .converter-card h2 {
            font-size: clamp(1.35rem, 5vw, 1.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
        }


        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }
        .form-control,
        .form-select {
            font-family: var(--font-sans);
            border-color: var(--color-border);
            border-radius: 10px;
            color: var(--color-text);
        }
        .form-control:focus,
        .form-select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 0.25rem rgba(15, 118, 110, 0.2);
        }


        .btn-primary {
            --bs-btn-bg: var(--color-primary);
            --bs-btn-border-color: var(--color-primary);
            --bs-btn-hover-bg: var(--color-primary-hover);
            --bs-btn-hover-border-color: var(--color-primary-hover);
            --bs-btn-active-bg: var(--color-primary-hover);
            --bs-btn-active-border-color: var(--color-primary-hover);
            --bs-btn-focus-shadow-rgb: 15, 118, 110;
            border-radius: 10px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }


        .result-box {
            font-family: var(--font-mono);
            font-size: clamp(1.25rem, 6vw, 1.6rem);
            font-weight: 700;
            color: var(--color-result-text);
            background: var(--color-result-bg);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            overflow-wrap: anywhere;
        }


        @media (max-width: 575.98px) {
            .converter-card { padding: 1.5rem 1.25rem !important; border-radius: 16px; }

            .converter-card .row > .col { flex: 0 0 100%; max-width: 100%; margin-bottom: 0.5rem; }
            .converter-card .row > .col.text-center { transform: rotate(90deg); margin-bottom: 0; }
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar site-navbar w-100" aria-label="Navegación principal">
        <div class="container navbar-content">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                <img class="navbar-logo" src="{{ url_for('static', filename='logo.png') }}"
                     alt="" width="44" height="44">
                <span>Conversor de Divisas</span>
            </a>
            <a class="navbar-link" href="#conversor" aria-current="location">Conversor</a>
        </div>
    </nav>

    <main class="d-flex flex-grow-1 justify-content-center align-items-center w-100 px-3 py-4">
        <div id="conversor" class="card shadow-lg p-4 converter-card">
            <h2 class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo.png') }}"
                     class="object-fit-contain" alt="" width="32" height="32">
                Conversor de Divisas
            </h2>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number" step="0.01" name="amount"
                           class="form-control form-control-lg"
                           placeholder="Introduce cantidad" required>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <select name="from_currency" class="form-select">
                            <option value="EUR">EUR €</option>
                            <option value="USD">USD $</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                    <div class="col text-center align-self-center">
                        →
                    </div>
                    <div class="col">
                        <select name="to_currency" class="form-select">
                            <option value="USD">USD $</option>
                            <option value="EUR">EUR €</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Convertir
                    </button>
                </div>
            </form>

            {% if result is not none %}
                <div class="mt-4 text-center result-box">
                    {{ result }}
                </div>
            {% endif %}
        </div>
    </main>

</body>
</html>
