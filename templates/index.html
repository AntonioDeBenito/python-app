<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }
        .site-navbar {
            padding: 1rem 0;
            background: #f8faff;
            border-bottom: 1px solid #dce5f3;
            box-shadow: 0 4px 18px rgba(15, 35, 70, 0.15);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        .site-navbar .navbar-content {
            gap: 1rem;
        }
        .site-navbar .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 0;
            color: #1e3c72;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: normal;
        }
        .site-navbar .navbar-logo {
            flex-shrink: 0;
            padding: 0.35rem;
            border-radius: 12px;
            background: #e8eef8;
            object-fit: contain;
        }
        .site-navbar .navbar-link {
            padding: 0.65rem 1.25rem;
            border-radius: 999px;
            background: #1e3c72;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
        }
        .site-navbar .navbar-link:hover {
            background: #2a5298;
        }
        .site-navbar a:focus-visible {
            outline: 3px solid #2a5298;
            outline-offset: 4px;
        }
        @media (max-width: 575.98px) {
            .site-navbar .navbar-content {
                flex-direction: column;
            }
            .site-navbar .navbar-brand {
                font-size: 1rem;
            }
            .site-navbar .navbar-link {
                width: 100%;
                text-align: center;
            }
        }
        .converter-card {
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .result-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #198754;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar site-navbar w-100" aria-label="Navegación principal">
        <div class="container navbar-content">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                <img class="navbar-logo" src="{{ url_for('static', filename='logo.png') }}"
                     alt="" width="44" height="44">
                <span>Conversor de Divisas</span>
            </a>
            <a class="navbar-link" href="#conversor" aria-current="location">Conversor</a>
        </div>
    </nav>

    <main class="d-flex flex-grow-1 justify-content-center align-items-center w-100 px-3 py-4">
        <div id="conversor" class="card shadow-lg p-4 converter-card" style="width: 400px;">
            <h2 class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo.png') }}"
                     class="object-fit-contain" alt="" width="32" height="32">
                Conversor de Divisas
            </h2>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number" step="0.01" name="amount"
                           class="form-control form-control-lg"
                           placeholder="Introduce cantidad" required>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <select name="from_currency" class="form-select">
                            <option value="EUR">EUR €</option>
                            <option value="USD">USD $</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                    <div class="col text-center align-self-center">
                        →
                    </div>
                    <div class="col">
                        <select name="to_currency" class="form-select">
                            <option value="USD">USD $</option>
                            <option value="EUR">EUR €</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Convertir
                    </button>
                </div>
            </form>

            {% if result is not none %}
                <div class="mt-4 text-center result-box">
                    {{ result }}
                </div>
            {% endif %}
        </div>
    </main>

</body>
</html>
